# PTP grandmaster on the DU, unicast UDPv4 (used on the dedicated PTP link: switches between racks drop the
# Layer-2 PTP multicast). The slave requests unicast service from 10.10.2.1.
[global]
dataset_comparison		G.8275.x
G.8275.defaultDS.localPriority	128
G.8275.portDS.localPriority	128
maxStepsRemoved			255
domainNumber			24
network_transport		UDPv4
unicast_listen			1
hybrid_e2e			0
logAnnounceInterval		-3
logSyncInterval			-4
logMinDelayReqInterval		-4
priority1			128
priority2			128
clockClass			6
serverOnly			1
ptp_minor_version		0
